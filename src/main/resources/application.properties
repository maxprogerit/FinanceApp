# ============================================================
# SHARED BASE CONFIGURATION
# Database and profile-specific settings live in:
#   application-dev.properties  — local PostgreSQL
#   application-prod.yml        — production PostgreSQL
# ============================================================

spring.profiles.active=dev

server.port=8081

# ── Thymeleaf ─────────────────────────────────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.application.name=Smart Finance Dashboard

# ── Jackson — ISO dates, ignore unknown fields ────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=dev-secret-key-please-change-in-production-min-256-bits
app.jwt.expiration-ms=86400000

# ── Stripe (test keys — override with env vars in prod) ───
stripe.secret-key=***REMOVED***
stripe.publishable-key=pk_test_51SVxo2GuQvDtHdWlGYTkfm8lzPRhZehMUrm0AW9IirXiqzwPlnoJpSO04m8dySnpiZgCSNuRyfd1UKqEHna2s9rx00YdMoJvSG

# ⚠️  IMPORTANT — two different webhook secrets:
#
#   1. Stripe Dashboard secret  (used for deployed production webhooks)
#      → Stripe Dashboard → Developers → Webhooks → your endpoint → Signing secret
#
#   2. Stripe CLI secret  (used for LOCAL development only)
#      → Generated each time you run:
#          stripe listen --forward-to localhost:8081/api/payments/webhook
#      → The CLI prints "Ready! Your webhook signing secret is whsec_xxxx" — use THAT below.
#      → The CLI secret CHANGES every session, so update when you restart the CLI.
#
stripe.webhook-secret=***REMOVED***
stripe.price-id=price_1TDMENGuQvDtHdWlUP4KatR8
stripe.pro-price-id=${STRIPE_PRO_PRICE_ID:${stripe.price-id}}

# ── Mail (SendGrid SMTP) ──────────────────────────────────
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=***REMOVED***
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=noreply@max-budget.com
app.mail.enabled=true

# ── OAuth2 (Google) ───────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=731167243847-bra899pf4j7705845358otvt175e6p81.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=***REMOVED***
spring.security.oauth2.client.registration.google.scope=email,profile

# ── Frontend URL ──────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:8081}
