# ── Multipart uploads ─────────────────────────────────────
# CSV imports: typically a few KB–MB; receipt images: up to ~10 MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
# Defer multipart parsing to controller so MaxUploadSizeExceededException
# is thrown inside the MVC context and caught by @RestControllerAdvice
spring.servlet.multipart.resolve-lazily=true

# ── Tesseract OCR ─────────────────────────────────────────────────────────────
# Set to the tesseract.exe path inside your installation:
app.ocr.tesseract-path=C:/Users/Maxim/AppData/Local/Programs/Tesseract-OCR/tesseract.exe
# Directory that CONTAINS .traineddata files (Tess4J setDatapath points here directly).
app.ocr.tessdata-path=C:/Users/Maxim/AppData/Local/Programs/Tesseract-OCR/tessdata
# Language(s) — must match .traineddata files in tessdata.
# srp = Serbian Cyrillic, srp_latn = Serbian Latin, eng = English
# Download missing files: https://github.com/tesseract-ocr/tessdata/tree/main
# Startup logs show which files are found / missing.
app.ocr.language=eng+srp+srp_latn
