# ============================================================
# DEVELOPMENT CONFIGURATION (default / dev profile)
# Uses H2 in-file database. Do NOT use in production.
# ============================================================

spring.profiles.active=dev

server.port=8081

# H2 Database (dev only)
spring.datasource.url=jdbc:h2:file:./data/financedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA — use update in dev so schema evolves automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — disabled in dev (Hibernate manages schema)
spring.flyway.enabled=false

# Thymeleaf (cache disabled for dev hot-reload)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.application.name=Smart Finance Dashboard

# Jackson — serialize LocalDate/LocalDateTime as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging (verbose for dev)
logging.level.com.smartfinance=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# JWT (dev secret — override in prod with env var)
app.jwt.secret=dev-secret-key-please-change-in-production-min-256-bits
app.jwt.expiration-ms=86400000

# Stripe (test keys — replace with env vars in prod)
stripe.secret-key=***REMOVED***
