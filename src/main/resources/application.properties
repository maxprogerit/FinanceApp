stripe.webhook-secret=***REMOVED***
stripe.price-id=price_1TDMENGuQvDtHdWlUP4KatR8
# PRO plan price ID — defaults to stripe.price-id if not overridden
stripe.pro-price-id=${STRIPE_PRO_PRICE_ID:${stripe.price-id}}
# PREMIUM plan price ID — leave blank if PREMIUM tier is not yet active
stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}

# Mail (disabled in dev — configure SMTP for prod)
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=***REMOVED***
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=noreply@max-budget.com
app.mail.enabled=true

# OAuth2 (disabled in dev — configure real credentials for prod)
