# ============================================================
# DEV PROFILE — Local PostgreSQL
# Activated by: spring.profiles.active=dev  (set in application.properties)
# ── Prerequisites ──────────────────────────────────────────
#   psql -U postgres -c "CREATE DATABASE finance;"
#   psql -U postgres -c "CREATE USER admin WITH PASSWORD 'admin';"
#   psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE finance TO admin;"
# ============================================================

# ── PostgreSQL datasource ─────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/finance
spring.datasource.username=postgres
spring.datasource.password=***REMOVED***
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Dialect ───────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── JPA — let Flyway manage the schema; Hibernate only validates ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Thymeleaf (cache off for hot reload) ─────────────────
spring.thymeleaf.cache=false

# ── Logging ───────────────────────────────────────────────
logging.level.com.smartfinance=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
