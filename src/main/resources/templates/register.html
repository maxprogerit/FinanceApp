<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Smart Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md px-4 py-8">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8">

            <div class="text-center mb-7">
                <h1 class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">💰 Smart Finance</h1>
                <p class="mt-2 text-gray-600 dark:text-gray-300">Create your account</p>
            </div>

            <div th:if="${error}" class="mb-5 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm" th:text="${error}"></div>
            <div th:if="${message}" class="mb-5 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm" th:text="${message}"></div>

            <form method="POST" th:action="@{/register}" id="registerForm" class="space-y-5">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                    <input type="text" id="username" name="username" required autofocus
                           autocomplete="username"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                           placeholder="Choose a username">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           autocomplete="email"
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                           placeholder="you@example.com">
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                        <button type="button" id="generateBtn"
                                class="text-xs text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 font-medium flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5">
                                <path fill-rule="evenodd" d="M10.868 2.884c-.321-.772-1.415-.772-1.736 0l-1.83 4.401-4.753.381c-.833.067-1.171 1.107-.536 1.651l3.62 3.102-1.106 4.637c-.194.813.691 1.456 1.405 1.02L10 15.591l4.069 2.485c.713.436 1.598-.207 1.404-1.02l-1.106-4.637 3.62-3.102c.635-.544.297-1.584-.536-1.65l-4.752-.382-1.83-4.4z" clip-rule="evenodd"/>
                            </svg>
                            Generate strong password
                        </button>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" name="password" required minlength="12"
                               autocomplete="new-password"
                               class="w-full px-4 py-3 pr-11 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                               placeholder="Minimum 12 characters">
                        <button type="button" id="togglePw"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
                                aria-label="Toggle password visibility">
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                            </svg>
                            <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 hidden">
                                <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.745-1.745a10.029 10.029 0 003.3-4.38 1.651 1.651 0 000-1.591C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074L3.28 2.22zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/>
                                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Live password requirements -->
                    <div id="pwRequirements" class="mt-3 grid grid-cols-2 gap-1.5 text-xs hidden">
                        <div id="req-length"  class="flex items-center gap-1.5 text-gray-400"><span class="req-dot w-2 h-2 rounded-full bg-gray-300 flex-shrink-0 transition-colors"></span>12+ characters</div>
                        <div id="req-upper"   class="flex items-center gap-1.5 text-gray-400"><span class="req-dot w-2 h-2 rounded-full bg-gray-300 flex-shrink-0 transition-colors"></span>Uppercase letter</div>
                        <div id="req-lower"   class="flex items-center gap-1.5 text-gray-400"><span class="req-dot w-2 h-2 rounded-full bg-gray-300 flex-shrink-0 transition-colors"></span>Lowercase letter</div>
                        <div id="req-number"  class="flex items-center gap-1.5 text-gray-400"><span class="req-dot w-2 h-2 rounded-full bg-gray-300 flex-shrink-0 transition-colors"></span>Number</div>
                        <div id="req-special" class="flex items-center gap-1.5 text-gray-400"><span class="req-dot w-2 h-2 rounded-full bg-gray-300 flex-shrink-0 transition-colors"></span>Special character</div>
                    </div>

                    <!-- Copy hint (shown after generate) -->
                    <p id="copyHint" class="mt-1.5 text-xs text-green-600 dark:text-green-400 hidden"></p>
                </div>

                <button type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-lg shadow hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                    Create Account
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                Already have an account?
                <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">Sign in</a>
            </p>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script>
        // ── Show/hide password ─────────────────────────────────────────────────
        document.getElementById('togglePw').addEventListener('click', function () {
            const pw = document.getElementById('password');
            const isHidden = pw.type === 'password';
            pw.type = isHidden ? 'text' : 'password';
            document.getElementById('eyeOpen').classList.toggle('hidden', isHidden);
            document.getElementById('eyeOff').classList.toggle('hidden', !isHidden);
        });

        // ── Password requirements live check ───────────────────────────────────
        const RULES = {
            'req-length':  pw => pw.length >= 12,
            'req-upper':   pw => /[A-Z]/.test(pw),
            'req-lower':   pw => /[a-z]/.test(pw),
            'req-number':  pw => /[0-9]/.test(pw),
            'req-special': pw => /[^A-Za-z0-9]/.test(pw),
        };

        function checkRequirements(pw) {
            const container = document.getElementById('pwRequirements');
            if (pw.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            for (const [id, test] of Object.entries(RULES)) {
                const el = document.getElementById(id);
                const dot = el.querySelector('.req-dot');
                const met = test(pw);
                el.classList.toggle('text-green-600', met);
                el.classList.toggle('dark:text-green-400', met);
                el.classList.toggle('text-gray-400', !met);
                dot.classList.toggle('bg-green-500', met);
                dot.classList.toggle('bg-gray-300', !met);
            }
        }

        document.getElementById('password').addEventListener('input', function () {
            checkRequirements(this.value);
        });

        // ── Password generator ─────────────────────────────────────────────────
        function generateStrongPassword(length = 16) {
            const upper   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lower   = 'abcdefghijklmnopqrstuvwxyz';
            const digits  = '0123456789';
            const special = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            const all     = upper + lower + digits + special;
            // Guarantee at least one of each required type
            const chars = [
                upper[Math.floor(Math.random() * upper.length)],
                lower[Math.floor(Math.random() * lower.length)],
                digits[Math.floor(Math.random() * digits.length)],
                special[Math.floor(Math.random() * special.length)],
            ];
            for (let i = 4; i < length; i++) {
                chars.push(all[Math.floor(Math.random() * all.length)]);
            }
            // Shuffle using Fisher-Yates
            for (let i = chars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return chars.join('');
        }

        document.getElementById('generateBtn').addEventListener('click', function () {
            const pw = generateStrongPassword();
            const field = document.getElementById('password');
            field.type = 'text';
            field.value = pw;
            document.getElementById('eyeOpen').classList.add('hidden');
            document.getElementById('eyeOff').classList.remove('hidden');
            checkRequirements(pw);

            // Copy to clipboard
            navigator.clipboard.writeText(pw).then(() => {
                const hint = document.getElementById('copyHint');
                hint.textContent = 'Password generated and copied to clipboard!';
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 4000);
            }).catch(() => {
                const hint = document.getElementById('copyHint');
                hint.textContent = 'Password generated — copy it before submitting.';
                hint.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
