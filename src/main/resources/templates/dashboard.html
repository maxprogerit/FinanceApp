<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Smart Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

<nav><!-- placeholder — app.js injects sidebar --></nav>

<main class="p-6 space-y-6">

    <!-- Metric Cards -->
    <div class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card metric-card" style="background-image: url('/images/totalBalnce.jpg')">
            <div class="metric-card-overlay"></div>
            <div class="metric-card-content">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Total Balance</p>
                <p id="totalBalance" class="text-2xl font-bold text-gray-900 dark:text-white">—</p>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Across all wallets</p>
            </div>
        </div>
        <div class="card metric-card" style="background-image: url('/images/income.jpg')">
            <div class="metric-card-overlay"></div>
            <div class="metric-card-content">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Monthly Income</p>
                <p id="monthlyIncome" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">—</p>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">This month so far</p>
            </div>
        </div>
        <div class="card metric-card" style="background-image: url('/images/expences.jpg')">
            <div class="metric-card-overlay"></div>
            <div class="metric-card-content">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Monthly Expenses</p>
                <p id="monthlyExpenses" class="text-2xl font-bold text-red-600 dark:text-red-400">—</p>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">This month so far</p>
            </div>
        </div>
        <div class="card metric-card" style="background-image: url('/images/netflow.jpg')">
            <div class="metric-card-overlay"></div>
            <div class="metric-card-content">
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-2">Net Flow</p>
                <p id="netFlow" class="text-2xl font-bold text-gray-900 dark:text-white">—</p>
                <p id="netFlowLabel" class="text-xs text-gray-400 dark:text-gray-500 mt-1">Income minus expenses</p>
            </div>
        </div>
    </div>

    <!-- Main row: Recent Transactions + Category Chart -->
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

        <div class="xl:col-span-2 card">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-semibold text-gray-900 dark:text-white">Recent Transactions</h2>
                <a href="/transactions" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-medium">View all →</a>
            </div>
            <div id="recentTransactions" class="divide-y divide-gray-100 dark:divide-gray-700">
                <p class="text-sm text-gray-400 py-6 text-center">Loading…</p>
            </div>
        </div>

        <div class="card">
            <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-1">Spending by Category</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">This month's breakdown</p>
            <div id="categoryChartWrap" style="position:relative; height:220px;">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Bottom row: Health Score + Insights -->
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

        <div class="card">
            <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Financial Health</h2>
            <div class="flex items-start gap-5">
                <div id="healthScoreCircle" class="inline-flex flex-col items-center justify-center w-24 h-24 rounded-full bg-gray-50 dark:bg-gray-800 ring-4 ring-gray-200 flex-shrink-0">
                    <span id="healthScoreValue" class="text-3xl font-bold leading-none text-gray-800 dark:text-white">—</span>
                    <span id="healthScoreGrade" class="text-xs font-semibold text-gray-500 dark:text-gray-400 mt-0.5">—</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p id="healthScoreAdvice" class="text-xs text-gray-500 dark:text-gray-400 mb-3 leading-relaxed italic"></p>
                    <div id="healthScoreBreakdown" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Insights</h2>
            <div id="insightsContainer" class="space-y-2">
                <p class="text-sm text-gray-400 text-center py-4">Loading…</p>
            </div>
        </div>
    </div>

</main>

<!-- Notification Panel -->
<div id="notificationPanel" class="hidden fixed right-4 top-16 w-80 bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-700">
        <span class="text-sm font-semibold text-gray-900 dark:text-white">Notifications</span>
        <button id="markAllRead" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Mark all read</button>
    </div>
    <div id="notificationList" class="p-3 max-h-80 overflow-y-auto"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
