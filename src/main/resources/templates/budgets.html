<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets — Smart Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

    <nav class="bg-white dark:bg-gray-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">💰 Smart Finance</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/dashboard" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Dashboard</a>
                        <a href="/transactions" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Transactions</a>
                        <a href="/budgets" class="nav-link border-indigo-500 text-gray-900 dark:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Budgets</a>
                        <a href="/investments" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Investments</a>
                        <a href="/goals" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Goals</a>
                        <a href="/reports" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Reports</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/settings" class="text-sm text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400">Settings</a>
                    <button id="themeToggle" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <svg id="themeIcon" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <a href="/logout" class="text-sm text-red-500 hover:text-red-700">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Budget Planning</h2>
            <button onclick="openBudgetModal()" class="btn-primary">+ Add Budget</button>
        </div>

        <!-- Month Selector -->
        <div class="card mb-6 flex items-center space-x-4">
            <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Month:</label>
            <input type="month" id="budgetMonth" class="form-input w-40"
                   value="">
            <button onclick="loadBudgets()" class="btn-secondary text-sm">Load</button>
        </div>

        <!-- Budget Summary -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="card bg-gradient-to-br from-blue-400 to-blue-600 text-white">
                <p class="text-sm opacity-90">Total Budget</p>
                <p class="text-3xl font-bold mt-1" id="totalBudget">$0.00</p>
            </div>
            <div class="card bg-gradient-to-br from-orange-400 to-orange-600 text-white">
                <p class="text-sm opacity-90">Total Spent</p>
                <p class="text-3xl font-bold mt-1" id="totalSpent">$0.00</p>
            </div>
            <div class="card bg-gradient-to-br from-green-400 to-green-600 text-white">
                <p class="text-sm opacity-90">Remaining</p>
                <p class="text-3xl font-bold mt-1" id="totalRemaining">$0.00</p>
            </div>
        </div>

        <!-- Budget List -->
        <div id="budgetList" class="space-y-4">
            <div class="card text-center text-gray-500 dark:text-gray-400 py-12">
                <p class="text-lg">No budgets yet. Create one to start tracking your spending limits.</p>
            </div>
        </div>
    </main>

    <!-- Add/Edit Budget Modal -->
    <div id="budgetModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6" id="budgetModalTitle">Add Budget</h3>
            <form id="budgetForm" class="space-y-4">
                <input type="hidden" id="budgetId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category</label>
                    <select id="budgetCategory" class="form-input w-full" required>
                        <option value="">Select category</option>
                        <option>FOOD</option><option>TRANSPORT</option><option>RENT</option>
                        <option>UTILITIES</option><option>ENTERTAINMENT</option><option>HEALTHCARE</option>
                        <option>EDUCATION</option><option>SHOPPING</option><option>OTHER</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Monthly Limit ($)</label>
                    <input type="number" id="budgetLimit" step="0.01" min="0" class="form-input w-full" placeholder="0.00" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start Date</label>
                        <input type="date" id="budgetStartDate" class="form-input w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End Date</label>
                        <input type="date" id="budgetEndDate" class="form-input w-full" required>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="btn-primary flex-1">Save Budget</button>
                    <button type="button" onclick="closeBudgetModal()" class="btn-secondary flex-1">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/budgets.js"></script>
</body>
</html>
