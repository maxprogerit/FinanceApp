<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals — Smart Finance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

    <nav class="bg-white dark:bg-gray-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">💰 Smart Finance</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/dashboard" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Dashboard</a>
                        <a href="/transactions" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Transactions</a>
                        <a href="/budgets" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Budgets</a>
                        <a href="/investments" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Investments</a>
                        <a href="/goals" class="nav-link border-indigo-500 text-gray-900 dark:text-white inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Goals</a>
                        <a href="/reports" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Reports</a>
                        <a href="/subscriptions" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Subscriptions</a>
                        <a href="/debts" class="nav-link border-transparent text-gray-500 dark:text-gray-300 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Debts</a>
                    <button id="themeToggle" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <svg id="themeIcon" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                        </svg>
                    </button>
                    <a href="/logout" class="text-sm text-red-500 hover:text-red-700">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Financial Goals</h2>
            <button onclick="openGoalModal()" class="btn-primary">+ New Goal</button>
        </div>

        <!-- Goals Summary -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="card bg-gradient-to-br from-indigo-400 to-indigo-600 text-white">
                <p class="text-sm opacity-90">Total Goals</p>
                <p class="text-3xl font-bold mt-1" id="totalGoals">0</p>
            </div>
            <div class="card bg-gradient-to-br from-green-400 to-green-600 text-white">
                <p class="text-sm opacity-90">Completed</p>
                <p class="text-3xl font-bold mt-1" id="completedGoals">0</p>
            </div>
            <div class="card bg-gradient-to-br from-yellow-400 to-yellow-600 text-white">
                <p class="text-sm opacity-90">Total Saved</p>
                <p class="text-3xl font-bold mt-1" id="totalSaved">$0.00</p>
            </div>
        </div>

        <!-- Goals List -->
        <div id="goalsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card text-center text-gray-500 dark:text-gray-400 py-12 col-span-full">
                <p class="text-5xl mb-4">🎯</p>
                <p class="text-lg">No goals yet. Create your first financial goal!</p>
            </div>
        </div>
    </main>

    <!-- Add/Edit Goal Modal -->
    <div id="goalModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6" id="goalModalTitle">New Goal</h3>
            <form id="goalForm" class="space-y-4">
                <input type="hidden" id="goalId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Goal Name</label>
                    <input type="text" id="goalName" class="form-input w-full" placeholder="e.g. Buy a Car" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                    <textarea id="goalDescription" rows="2" class="form-input w-full" placeholder="Optional description"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Target Amount ($)</label>
                        <input type="number" id="goalTarget" step="0.01" min="0" class="form-input w-full" placeholder="10000" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Current Savings ($)</label>
                        <input type="number" id="goalCurrent" step="0.01" min="0" class="form-input w-full" placeholder="0" value="0">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Target Date</label>
                    <input type="date" id="goalDeadline" class="form-input w-full" required>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="btn-primary flex-1">Save Goal</button>
                    <button type="button" onclick="closeGoalModal()" class="btn-secondary flex-1">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Contribute Modal -->
    <div id="contributeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 w-full max-w-sm mx-4">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Add Contribution</h3>
            <div class="space-y-4">
                <input type="hidden" id="contributeGoalId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Amount ($)</label>
                    <input type="number" id="contributeAmount" step="0.01" min="0" class="form-input w-full" placeholder="500">
                </div>
                <div class="flex gap-3">
                    <button onclick="submitContribution()" class="btn-primary flex-1">Add</button>
                    <button onclick="closeContributeModal()" class="btn-secondary flex-1">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/goals.js"></script>
</body>
</html>
