# ============================================================
# Nginx configuration for Smart Finance Dashboard
# Place at: /etc/nginx/sites-available/financeapp
# Enable: ln -s /etc/nginx/sites-available/financeapp /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (managed by Certbot / Let's Encrypt) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Rate limiting (define zones in nginx.conf http block) ─────────────────
    # In /etc/nginx/nginx.conf http {} add:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    #   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upload size (for CSV import) ──────────────────────────────────────────
    client_max_body_size 10M;

    # ── Proxy to Spring Boot backend ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Rate-limit auth endpoints more aggressively
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Stripe webhooks — no rate limiting (Stripe retries)
    location /api/payments/webhook {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other requests (Thymeleaf pages, static assets) → backend
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8081;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/financeapp_access.log;
    error_log  /var/log/nginx/financeapp_error.log;
}
